<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran UKM - Tugas 3</title>
</head>
<body>

    <header>
        <h1>Portal Data & Formulir Mahasiswa</h1>
        <nav>
            <a href="data.html">Data Mahasiswa</a> | 
            <a href="form.html">Formulir Pendaftaran UKM</a>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>Formulir Pendaftaran Unit Kegiatan Mahasiswa (UKM)</h2>
            <form action="#" method="post">
                
                <!-- 1. Text Input -->
                <p>
                    <label for="nama">Nama Lengkap:</label><br>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda" required>
                </p>

                <!-- 2. Email Input -->
                <p>
                    <label for="email">Alamat Email:</label><br>
                    <input type="email" id="email" name="email" placeholder="contoh@domain.com" required>
                </p>

                <!-- 3. Password Input -->
                <p>
                    <label for="password">Kata Sandi Akun:</label><br>
                    <input type="password" id="password" name="password" placeholder="Buat kata sandi baru" required>
                </p>

                <!-- 4. Number Input dengan Min & Max -->
                <p>
                    <label for="umur">Umur (Tahun):</label><br>
                    <input type="number" id="umur" name="umur" min="15" max="40" placeholder="18" required>
                </p>

                <!-- 5. Date Input -->
                <p>
                    <label for="tanggal_lahir">Tanggal Lahir:</label><br>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
                </p>

                <!-- 6. Radio Button dengan Fieldset & Legend -->
                <fieldset>
                    <legend>Jenis Kelamin:</legend>
                    <input type="radio" id="pria" name="gender" value="Pria" required>
                    <label for="pria">Laki-Laki</label><br>
                    <input type="radio" id="wanita" name="gender" value="Wanita">
                    <label for="wanita">Perempuan</label>
                </fieldset>
                <br>

                <!-- 7. Select (Dropdown Min 4 Option) -->
                <p>
                    <label for="ukm">Pilihan UKM:</label><br>
                    <select id="ukm" name="ukm" required>
                        <option value="">-- Pilih UKM --</option>
                        <option value="olahraga">UKM Olahraga & Sepak Bola</option>
                        <option value="fotografi">UKM Fotografi & Lensa</option>
                        <option value="kewirausahaan">UKM Kewirausahaan</option>
                        <option value="paduan_suara">UKM Paduan Suara</option>
                    </select>
                </p>

                <!-- 8. Checkbox (Min 3 Pilihan) -->
                <fieldset>
                    <legend>Hari Latihan yang Dipilih (Bisa pilih lebih dari satu):</legend>
                    <input type="checkbox" id="jumat" name="hari" value="Jumat">
                    <label for="jumat">Jumat</label><br>
                    <input type="checkbox" id="sabtu" name="hari" value="Sabtu">
                    <label for="sabtu">Sabtu</label><br>
                    <input type="checkbox" id="minggu" name="hari" value="Minggu">
                    <label for="minggu">Minggu</label>
                </fieldset>
                <br>

                <!-- 9. Textarea -->
                <p>
                    <label for="alasan">Alasan Bergabung:</label><br>
                    <textarea id="alasan" name="alasan" rows="4" cols="50" placeholder="Tuliskan motivasi Anda bergabung..." required></textarea>
                </p>

                <!-- Buttons -->
                <p>
                    <button type="submit">Kirim Pendaftaran</button>
                    <button type="reset">Reset Form</button>
                </p>

            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Tugas 3 Pemrograman Web - All Rights Reserved.</p>
    </footer>

</body>
</html>
